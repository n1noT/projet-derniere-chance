<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Dernière Chance</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #111;
      color: #f0f0f0;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
    }

    header h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    #platform-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
      background: #c8102e;
      color: #fff;
    }

#main {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 4px;
    }

    .field input {
      width: 100%;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 6px;
      color: #f0f0f0;
      font-size: 13px;
      padding: 7px 10px;
      outline: none;
      transition: border-color 0.15s;
    }

    .field input:focus { border-color: #555; }

    .row { display: flex; gap: 10px; }
    .row .field { flex: 1; }

    #save-btn {
      width: 100%;
      padding: 10px;
      background: #e50914;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      margin-top: 2px;
    }

    #save-btn:hover { background: #c8102e; }
    #save-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    #status {
      font-size: 12px;
      text-align: center;
      min-height: 18px;
      color: #4caf50;
    }

    #status.error { color: #e57373; }

    /* Settings */
    #settings-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      background: none;
      border: none;
      border-top: 1px solid #2a2a2a;
      color: #777;
      font-size: 12px;
      cursor: pointer;
      width: 100%;
      text-align: left;
    }

    #settings-toggle:hover { color: #aaa; }

    #settings-panel {
      display: none;
      padding: 12px 16px;
      border-top: 1px solid #2a2a2a;
      background: #0d0d0d;
      gap: 10px;
      flex-direction: column;
    }

    #settings-panel.open { display: flex; }

    #settings-save {
      padding: 7px;
      background: #333;
      color: #f0f0f0;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    #settings-save:hover { background: #444; }

    .checkbox-field {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #ccc;
      cursor: pointer;
    }

    .checkbox-field input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: #e50914;
      cursor: pointer;
    }

    /* Unsupported page */
    #unsupported {
      display: none;
      padding: 24px 16px;
      text-align: center;
      color: #666;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <header>
    <h1>Dernière Chance</h1>
    <span id="platform-badge"></span>
  </header>

  <div id="unsupported">
    Cette page n'est pas supportée.<br>
    Allez sur une fiche film CANAL+.
  </div>

  <div id="main">
    <div class="field">
      <label>Titre</label>
      <input type="text" id="title" placeholder="Titre du film ou de la série">
    </div>

    <div class="row">
      <div class="field">
        <label>Genre</label>
        <input type="text" id="genre" placeholder="Drame, Action…">
      </div>
      <div class="field">
        <label>Durée (min)</label>
        <input type="number" id="duration" placeholder="120">
      </div>
    </div>

    <div class="field">
      <label>Réalisateur</label>
      <input type="text" id="director" placeholder="Christopher Nolan">
    </div>

    <div class="field">
      <label>Expire le</label>
      <input type="text" id="expiry" placeholder="15/06">
    </div>

    <label class="checkbox-field">
      <input type="checkbox" id="dd">
      <span>Possédé en DVD / Blu-ray</span>
    </label>

    <button id="save-btn">＋ Ajouter à Sheets</button>
    <div id="status"></div>
  </div>

  <button id="settings-toggle">⚙ Paramètres</button>

  <div id="settings-panel">
    <div class="field">
      <label>ID du Spreadsheet</label>
      <input type="text" id="cfg-sheet-id" placeholder="1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgVE2upms">
    </div>
    <div class="field">
      <label>Nom de l'onglet</label>
      <input type="text" id="cfg-sheet-name" placeholder="Films">
    </div>
    <button id="settings-save">Sauvegarder</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
